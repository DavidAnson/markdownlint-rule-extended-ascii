name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - 'dependabot/**'
  workflow_dispatch:

jobs:

  check-links:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - run: 'npx linkinator "*.md" --skip "^https://wikipedia.org/"'

  check-spelling:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: tbroadley/spellchecker-cli-action@v1
      with:
        dictionaries: '.github/dictionary.txt'
        files: '*.md'

  run-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: current
    - run: npm install
    - run: npm test
